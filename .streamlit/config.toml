# Freefall Fire Atlas theme: "mission archive", dark microfiche (1960s case files on film).
# Forced dark for everyone, independent of the viewer's OS setting (a single [theme] with
# no [theme.light]/[theme.dark] split, so Streamlit does not OS-adapt). Tokens are mirrored
# in app/components/__init__.py THEMES; the look itself is app/static/css/archive.css.

[client]
toolbarMode = "minimal"

[theme]
base = "dark"
font = "Courier Prime:https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap"
headingFont = "Special Elite:https://fonts.googleapis.com/css2?family=Special+Elite&display=swap"
codeFont = "Courier Prime:https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap"
baseRadius = "0.15rem"
headingFontWeights = [400, 400, 400, 700, 700, 700]
headingFontSizes = ["2.4rem", "1.65rem", "1.3rem", "1.08rem", "1rem", "0.9rem"]
primaryColor = "#d8673f"
backgroundColor = "#1c1a16"
secondaryBackgroundColor = "#26231e"
textColor = "#ece2cb"
borderColor = "#4a4336"
linkColor = "#8fb4dc"

[theme.sidebar]
backgroundColor = "#171512"
secondaryBackgroundColor = "#211e19"
borderColor = "#3a352c"
